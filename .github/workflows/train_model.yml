name: Train Model

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: Épocas
        required: true
        default: '3'

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Expand dataset if needed
        run: |
          python expand_dataset.py || true

      - name: Train model
        env:
          EPOCHS: ${{ github.event.inputs.epochs }}
        run: |
          python train.py --epochs "$EPOCHS"

      - name: Commit model artifacts
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add models memory training_input
          if git diff --staged --quiet; then
            echo "Sem alterações"
          else
            git commit -m "Train model [skip ci]"
            git push
          fi
